name: Signed release

on:
  push:
    tags: ["v*"]

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Validate release version and source tree
        run: |
          node app/check-release-version.mjs
          python scripts/audit_distribution.py
      - name: Require Apple signing material
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for value in "$CERTIFICATE" "$CERTIFICATE_PASSWORD" "$SIGN_IDENTITY" "$API_KEY" "$API_KEY_ID" "$API_ISSUER"; do
            test -n "$value" || { echo "Apple release secrets are incomplete" >&2; exit 1; }
          done
      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/clippi-health.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/clippi-health.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - name: Prepare notarization key
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: Install build dependencies
        run: |
          python -m pip install -r packaging/requirements-build.txt
          cd app
          npm ci
      - name: Build, sign, and notarize application
        working-directory: app
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run make
      - name: Notarize and staple disk image
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun notarytool submit app/out/make/Clippi-Health.dmg --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple app/out/make/Clippi-Health.dmg
          xcrun stapler validate app/out/make/Clippi-Health.dmg
          hdiutil verify app/out/make/Clippi-Health.dmg
          codesign --verify --deep --strict --verbose=2 app/out/Clippi-Health-darwin-${{ matrix.arch }}/Clippi-Health.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: app/out/make/**
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Validate release version and source tree
        run: |
          node app/check-release-version.mjs
          python scripts/audit_distribution.py
      - name: Require Artifact Signing configuration
        shell: pwsh
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: |
          @($env:CLIENT_ID, $env:TENANT_ID, $env:SUBSCRIPTION_ID, $env:ENDPOINT, $env:ACCOUNT, $env:PROFILE) | ForEach-Object {
            if ([string]::IsNullOrWhiteSpace($_)) { throw "Microsoft Artifact Signing configuration is incomplete" }
          }
      - name: Install build dependencies
        run: |
          python -m pip install -r packaging/requirements-build.txt
          cd app
          npm ci
      - name: Package application
        working-directory: app
        run: |
          npm run build
          npm run runtime:prepare
          npm run runtime:check
          npx electron-forge package
      - name: Catalog unsigned application binaries
        shell: pwsh
        run: |
          $extensions = @('.exe', '.dll', '.node', '.pyd')
          $files = Get-ChildItem app/out/Clippi-Health-win32-x64 -Recurse -File | Where-Object {
            $extensions -contains $_.Extension.ToLower() -and (Get-AuthenticodeSignature $_.FullName).Status -eq 'NotSigned'
          }
          if ($files.Count -eq 0) { throw 'No unsigned application binaries were found' }
          $files | ForEach-Object { Resolve-Path -Relative $_.FullName } | Set-Content windows-signing-catalog.txt
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign application binaries
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-catalog: ${{ github.workspace }}\windows-signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Make installer from signed application
        working-directory: app
        run: npx electron-forge make --skip-package
      - name: Sign installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\app\out\make
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify Windows signatures
        shell: pwsh
        run: |
          $files = @(
            'app/out/Clippi-Health-win32-x64/Clippi-Health.exe',
            (Get-ChildItem app/out/make -Recurse -Filter '*Setup.exe' | Select-Object -First 1).FullName
          )
          foreach ($file in $files) {
            if ((Get-AuthenticodeSignature $file).Status -ne 'Valid') { throw "Invalid signature: $file" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: app/out/make/**
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Validate release version and source tree
        run: |
          node app/check-release-version.mjs
          python scripts/audit_distribution.py
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot
          python -m pip install -r packaging/requirements-build.txt
          cd app
          npm ci
      - name: Build packages
        working-directory: app
        run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: app/out/make/**
          if-no-files-found: error

  draft-release:
    name: Create draft release
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.deb' \) -print0)
          test ${#files[@]} -gt 0
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --generate-notes --verify-tag --title "Clippi-Health $GITHUB_REF_NAME"
