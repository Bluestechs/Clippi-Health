name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Audit public source tree
        run: python scripts/audit_distribution.py
      - name: Verify immutable workflow dependencies
        run: python scripts/audit_workflows.py
      - name: Test record engine
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install desktop dependencies
        working-directory: app
        run: npm ci
      - name: Check desktop app
        working-directory: app
        run: |
          npm run typecheck
          npm test
          npm run build
          python ../scripts/audit_npm.py
      - name: Inspect desktop package manifest
        working-directory: app
        run: npm pack --dry-run --json
