name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Audit public source tree
        run: python scripts/audit_distribution.py
      - name: Verify immutable workflow dependencies
        run: python scripts/audit_workflows.py
      - name: Test record engine
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install desktop dependencies
        working-directory: app
        run: npm ci
      - name: Check desktop app
        working-directory: app
        run: |
          npm run typecheck
          npm test
          npm run build
          python ../scripts/audit_npm.py
      - name: Inspect desktop package manifest
        working-directory: app
        run: npm pack --dry-run --json
