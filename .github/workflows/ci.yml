name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Audit public source tree
        run: python scripts/audit_distribution.py
      - name: Test record engine
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install desktop dependencies
        working-directory: app
        run: npm ci
      - name: Check desktop app
        working-directory: app
        run: |
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev
      - name: Inspect desktop package manifest
        working-directory: app
        run: npm pack --dry-run --json
