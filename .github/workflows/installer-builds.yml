name: Installer builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64-evaluation
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64-evaluation
          - name: Windows x64
            os: windows-2025
            artifact: windows-x64-evaluation
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64-evaluation
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot
      - name: Install runtime builder
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Install desktop dependencies
        working-directory: app
        run: npm ci
      - name: Build and verify installer
        working-directory: app
        run: npm run make
      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: app/out/make/**
          if-no-files-found: error
          retention-days: 7
