name: Signed macOS builds

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      MACOS_CERTIFICATE_P12_BASE64:
        required: true
      MACOS_CERTIFICATE_PASSWORD:
        required: true
      MACOS_SIGN_IDENTITY:
        required: true
      APPLE_API_KEY_BASE64:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER:
        required: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Validate source tree and matching release tags
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then node app/check-release-version.mjs; fi
          python scripts/audit_distribution.py
          python scripts/audit_workflows.py
      - name: Require Apple signing material
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for value in "$CERTIFICATE" "$CERTIFICATE_PASSWORD" "$SIGN_IDENTITY" "$API_KEY" "$API_KEY_ID" "$API_ISSUER"; do
            test -n "$value" || { echo "Apple release secrets are incomplete" >&2; exit 1; }
          done
      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/clippi-health.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/clippi-health.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - name: Prepare notarization key
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: Install build dependencies
        run: |
          python -m pip install -r packaging/requirements-build.txt
          cd app
          npm ci
      - name: Build, sign, and notarize application
        working-directory: app
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run make
      - name: Notarize and staple disk image
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun notarytool submit app/out/make/Clippi-Health.dmg --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple app/out/make/Clippi-Health.dmg
          xcrun stapler validate app/out/make/Clippi-Health.dmg
          hdiutil verify app/out/make/Clippi-Health.dmg
          codesign --verify --deep --strict --verbose=2 app/out/Clippi-Health-darwin-${{ matrix.arch }}/Clippi-Health.app
      - name: Verify native app from notarized disk image
        run: |
          mount="$RUNNER_TEMP/clippi-notarized-${{ matrix.arch }}"
          mkdir "$mount"
          hdiutil attach app/out/make/Clippi-Health.dmg -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          application="$mount/Clippi-Health.app"
          expected="${{ matrix.arch }}"
          if [[ "$expected" == "x64" ]]; then expected="x86_64"; fi
          test "$(lipo -archs "$application/Contents/MacOS/Clippi-Health")" = "$expected"
          test "$(lipo -archs "$application/Contents/Resources/clippi-runtime/clippi-runtime")" = "$expected"
          node app/verify-runtime.mjs "$application/Contents/Resources/clippi-runtime"
          TMPDIR="$RUNNER_TEMP" "$application/Contents/MacOS/Clippi-Health" --smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: app/out/make/**
          if-no-files-found: error
