name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packaging/requirements-build.txt
            packaging/requirements-security.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verify immutable workflow dependencies
        run: python scripts/audit_workflows.py
      - name: Audit Python dependencies
        run: |
          python -m pip install -r packaging/requirements-security.txt
          python -m pip_audit -r packaging/requirements-build.txt --strict
      - name: Audit all npm dependencies
        working-directory: app
        run: |
          npm ci --ignore-scripts
          python ../scripts/audit_npm.py

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: javascript-typescript,python
          queries: security-extended
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
